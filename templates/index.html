<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b45">
  <meta name="description" content="Campus information assistant for Great Zimbabwe University">
  <link rel="manifest" href="/manifest.json">
  <title>GZU Campus Assistant</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #18352a; background: #f2f7f3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    main { width: min(760px, 100%); background: white; border-radius: 18px;
           box-shadow: 0 8px 32px #153b251c; overflow: hidden; }
    header { background: #176b45; color: white; padding: 22px; }
    header h1 { margin: 0 0 7px; font-size: 1.45rem; }
    header p { margin: 0; opacity: .9; }
    #messages { height: min(55vh, 520px); min-height: 280px; overflow-y: auto;
                padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 90%; padding: 12px 14px; border-radius: 14px;
              white-space: pre-wrap; line-height: 1.45; overflow-wrap: anywhere; }
    .bot { background: #edf5ef; align-self: flex-start; }
    .user { background: #176b45; color: white; align-self: flex-end; }
    form { display: flex; gap: 8px; padding: 14px; border-top: 1px solid #e3ebe5; }
    input { min-width: 0; flex: 1; border: 1px solid #c9d8ce; border-radius: 10px;
            padding: 13px; font-size: 1rem; }
    button { background: #176b45; color: white; border: 0; border-radius: 10px;
             padding: 12px 16px; cursor: pointer; font-size: 1rem; }
    button:disabled { opacity: .6; cursor: wait; }
    .tools { padding: 0 14px 14px; color: #4a6255; font-size: .88rem; }
    .tools a { color: #176b45; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>GZU Campus Assistant</h1>
    <p>Great Zimbabwe University — campus and student information</p>
  </header>
  <section id="messages" aria-live="polite">
    <div class="bubble bot">Hello! Ask me about university FAQs, registration, or campus locations.</div>
  </section>
  <form id="chat-form">
    <input id="message" autocomplete="off" placeholder="Type your question..." aria-label="Your question" required>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="tools">
    <a href="https://www.gzu.ac.zw/" target="_blank" rel="noopener">Official GZU website</a>
    <span id="status"> · Ready</span>
  </div>
</main>
<script>
const form = document.getElementById("chat-form");
const input = document.getElementById("message");
const messages = document.getElementById("messages");
const send = document.getElementById("send");
const status = document.getElementById("status");

function addBubble(text, kind) {
  const node = document.createElement("div");
  node.className = "bubble " + kind;
  node.textContent = text;
  messages.appendChild(node);
  messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addBubble(message, "user");
  input.value = "";
  send.disabled = true;
  status.textContent = " · Thinking...";

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.response || "Request failed");
    addBubble(data.response || "No answer was returned.", "bot");
    status.textContent = " · Ready";
  } catch (error) {
    addBubble("I couldn't connect to the chatbot server. Please try again when the server is available.", "bot");
    status.textContent = " · Connection issue";
  } finally {
    send.disabled = false;
    input.focus();
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch(error => {
      console.warn("Service worker registration failed:", error);
    });
  });
}
</script>
</body>
</html>
